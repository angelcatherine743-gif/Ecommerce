<!DOCTYPE html>
<html>
<head>

<title>E-Commerce Product Catalog</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
<div class="container">
<a class="navbar-brand" href="#">Product Catalog</a>

<input class="form-control w-25" type="text" placeholder="Search products..." id="searchInput">

<select class="form-select w-25 ms-3" id="categoryFilter">
<option value="all">All Categories</option>
<option value="electronics">Electronics</option>
<option value="fashion">Fashion</option>
<option value="home">Home</option>
</select>
</div>
</nav>

<!-- Product Grid -->
<div class="container mt-4">
<div class="row" id="product-list">

</div>
</div>


<!-- Product Modal -->
<div class="modal fade" id="productModal">
<div class="modal-dialog">
<div class="modal-content">

<div class="modal-header">
<h5 class="modal-title" id="modalTitle"></h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
<img id="modalImage" class="img-fluid mb-3">
<p id="modalDescription"></p>
</div>

</div>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
